name: Build HAOS app image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vk_music_assistant/**"
      - "provider/**"
      - ".github/workflows/build-addon.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: vk-edition-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build context must be the repository root: the Dockerfile copies
          # provider/vk_music, which is outside vk_music_assistant/.
          context: .
          file: ./vk_music_assistant/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/music-assistant-vk-edition:0.1.0
