name: Build HAOS app image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "music_assistant_vk/**"
      - "provider/**"
      - ".github/workflows/build-addon.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: vk-edition-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/^version: *["\x27]*\([^"\x27]*\)["\x27]*$/\1/p' music_assistant_vk/config.yaml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not read version from music_assistant_vk/config.yaml" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./music_assistant_vk/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/music-assistant-vk-edition:${{ steps.version.outputs.value }}
