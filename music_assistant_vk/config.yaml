name: Music Assistant VK Edition
version: "0.2.7"
slug: music_assistant_vk
description: Music Assistant 2.10.9 with VK Music, personal library, playlists and interactive login
url: https://github.com/maxidrom2008/music-assistant-vk-edition
changelog: https://raw.githubusercontent.com/maxidrom2008/music-assistant-vk-edition/main/CHANGELOG.md
arch:
  - amd64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
  - mcp
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music
panel_title: Music Assistant VK
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: experimental
image: ghcr.io/maxidrom2008/music-assistant-vk-edition
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
